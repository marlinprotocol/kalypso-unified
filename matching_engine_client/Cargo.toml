[package]
name = "matching_engine_client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = { version = "4.5.1", features = ["rustls"] }
anyhow = "1.0.86"
bindings = { path = "../bindings", package = "foundry-contracts" }
dotenv = "0.15.0"
ecies = {version = "0.2.6", features = ["std"]}
env_logger = "0.11.3"
ethers = {version = "2", features = ["abigen", "ws", "rustls"] }
futures-util = "0.3"
helper = {path = "../helper", package = "helper"}
hex = "0.4"
log = "0.4"
secp256k1 = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.14"
serde_json="1.0"
tokio = { version = "1.16.1", features = ["full"] }
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
uuid = { version = "1.4.1",features = ["v4","fast-rng","macro-diagnostics"] }
validator = { version = "0.18.1", features = ["derive"] }

[dev-dependencies]
actix-rt = "2"