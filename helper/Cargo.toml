[package]
name = "helper"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-nitro-enclaves-cose = "0.5.1"
actix-extensible-rate-limit = "0.3.1"
actix-web = "4.5.1"
bytes = "1.0"
aes-gcm = "0.10.3"
anyhow = "1.0.86"
chrono = { version = "0.4", features = ["serde"] }
ecies = {version = "0.2.6", features = ["std"]}
ethers = { version = "2", features = ["rustls"] }
flate2 = "1.0.28"
futures = "0.3"
hex = "0.4.3"
hyper = { version = "1.2.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.3", features = ["full"] }
log = "0.4"
openssl = { version = "0.10.57", features = ["vendored"] }
pem = "1.0"
prometheus-client ={ version = "0.22.3"}
reqwest = { version = "0.11", features = ["stream"] }
secp256k1 = "0.30.0"
serde = "1.0"
serde_cbor = "0.11.2"
serde_json = "1.0"
thiserror = "1.0.58"
validator = { version = "0.18.1", features = ["derive"] }
rustls = "0.20"
tokio = { version = "1", features = ["full"] }
actix-cors = {version = "0.7.0", optional=true }

[features]
default = []
enable_cors = ["actix-cors"]