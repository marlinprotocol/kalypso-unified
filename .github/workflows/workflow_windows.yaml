# .github/workflows/workflow_windows.yaml

name: Rust CI - Windows

on:
  push:
    branches: [ "main", "listener-refined" ]
  pull_request:
    branches: [ "main", "listener-refined" ]

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache Cargo registry and git index
        uses: actions/cache@v3
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            ${{ runner.os }}-cargo-git-

      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-windows-${{ hashFiles('**/Cargo.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-cargo-build-windows-
            ${{ runner.os }}-cargo-build-

      - name: Remove .cargo/config.toml if exists
        shell: powershell
        run: Remove-Item -Path .\.cargo\config.toml -ErrorAction SilentlyContinue

      - name: Update dependencies
        run: cargo update

  test:
    name: Test Suite (Windows)
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache Cargo registry and git index
        uses: actions/cache@v3
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            ${{ runner.os }}-cargo-git-

      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-windows-${{ hashFiles('**/Cargo.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-cargo-build-windows-
            ${{ runner.os }}-cargo-build-

      - name: Remove .cargo/config.toml if exists
        shell: powershell
        run: Remove-Item -Path .\.cargo\config.toml -ErrorAction SilentlyContinue

      - name: Update dependencies
        run: cargo update

      - name: Verify Installed Targets
        run: rustup target list --installed

      - name: Run cargo test
        env:
          RUST_BACKTRACE: 1
        run: cargo test --target x86_64-pc-windows-msvc
