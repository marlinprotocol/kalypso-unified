name: Rust CI

on:
  push:
    branches: [ master, listener-refined ]
  pull_request:
    branches: [ master, listener-refined ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [
          x86_64-unknown-linux-musl,  # Linux with musl
          x86_64-unknown-linux-gnu,   # Linux default
          x86_64-pc-windows-msvc,     # Windows default
          x86_64-apple-darwin          # macOS default
        ]
      exclude:
        - os: windows-latest
          target: x86_64-unknown-linux-musl
        - os: macos-latest
          target: x86_64-unknown-linux-musl

    name: Build on ${{ matrix.os }} with target ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Rust 1.80
        uses: actions/setup-rust@v1  # Corrected version
        with:
          rust-version: "1.80.0"

      # Install musl target only for Linux with musl
      - name: Install musl target
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-musl'
        run: rustup target add x86_64-unknown-linux-musl

      # Cache Cargo registry
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-registry-

      # Cache Cargo git index
      - name: Cache Cargo git index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-git-

      # Cache Cargo build
      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-build-

      # Set environment variables for rustflags if needed
      - name: Set environment variables
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-musl'

      # Check code formatting
      - name: Check code formatting
        run: cargo fmt -- --check

      # Run Clippy for linting
      - name: Run Clippy
        run: cargo clippy -- -D warnings

      # Build the project
      - name: Build project
        run: cargo build --verbose --target ${{ matrix.target }}

      # Run tests
      - name: Run tests
        run: cargo test --verbose --target ${{ matrix.target }}
